version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: edusense_db_dev
    environment:
      POSTGRES_USER: edusense
      POSTGRES_PASSWORD: edusense
      POSTGRES_DB: edusense
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edusense"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edusense_backend_dev
    environment:
      - EDUSENSE_DATABASE_URL=postgresql+psycopg2://edusense:edusense@db:5432/edusense
      - EDUSENSE_SECRET_KEY=dev-secret-key-change-in-production
      - EDUSENSE_DEBUG=true
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - OLLAMA_MODELS=${OLLAMA_MODELS:-D:/OllamaModels}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app          # hot-reload source
      - model_cache:/app/models
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: edusense_frontend_dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata_dev:
  model_cache:
  node_modules:
